name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ----------------------------------------------------------
  # Spec validation — `spec.json` matches all consumers
  # ----------------------------------------------------------
  validate-spec:
    name: Validate spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run validate-spec
        run: cargo run --manifest-path scripts/validate-spec/Cargo.toml --release

  # ----------------------------------------------------------
  # On-chain program — build + unit tests
  # ----------------------------------------------------------
  onchain:
    name: On-chain program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            onchain/target
          key: ${{ runner.os }}-onchain-${{ hashFiles('onchain/Cargo.lock') }}
      - name: cargo check
        working-directory: onchain
        run: cargo check --workspace
      - name: cargo test (lib)
        working-directory: onchain
        run: cargo test -p zk_pool --lib

  # ----------------------------------------------------------
  # LiteSVM integration tests
  #
  # Requires two .so files:
  #   - zk_pool.so          — built here via `anchor build`.
  #   - withdrawal.so       — the Sunspot verifier. Building the real
  #                            verifier needs nargo + sunspot + the
  #                            gnark crate; too heavy for CI. The
  #                            tests only exercise validation + CPI
  #                            reach, never a real proof, so a minimal
  #                            mock verifier .so is sufficient.
  #                            Real proof verification is E2E on devnet
  #                            (Stage 15.9), not CI.
  # ----------------------------------------------------------
  litesvm:
    name: LiteSVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (SBF toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://release.anza.xyz/stable/install" | sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          # Install the Anchor CLI binary directly from the release tag.
          # `avm` is not needed — we want a fixed version and nothing else.
          curl -L "https://github.com/coral-xyz/anchor/releases/download/v0.31.1/anchor-0.31.1-x86_64-unknown-linux-gnu" \
            -o /usr/local/bin/anchor
          chmod +x /usr/local/bin/anchor
          anchor --version

      - name: Build zk_pool.so
        working-directory: onchain
        run: anchor build --no-idl

      - name: Build mock verifier .so
        working-directory: onchain
        run: |
          mkdir -p ../circuits/withdrawal/target
          cargo build-sbf \
            --manifest-path tests/mock-verifier/Cargo.toml \
            --sbf-out-dir ../circuits/withdrawal/target
          # The mock binary is emitted as `mock_verifier.so`; the tests
          # look for `withdrawal.so`. Rename.
          mv ../circuits/withdrawal/target/mock_verifier.so \
             ../circuits/withdrawal/target/withdrawal.so

      - name: Install Rust (LiteSVM toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tests/target
          key: ${{ runner.os }}-tests-${{ hashFiles('tests/Cargo.lock') }}

      - name: cargo test
        working-directory: tests
        run: cargo test

  # ----------------------------------------------------------
  # Backend — build + unit tests
  # ----------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/backend/target
          key: ${{ runner.os }}-backend-${{ hashFiles('services/backend/Cargo.lock') }}
      - name: cargo test
        working-directory: services/backend
        run: cargo test --lib
      - name: cargo build (release)
        working-directory: services/backend
        run: cargo build --release

  # ----------------------------------------------------------
  # Prover — build + unit tests
  # ----------------------------------------------------------
  prover:
    name: Prover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/prover/target
          key: ${{ runner.os }}-prover-${{ hashFiles('services/prover/Cargo.lock') }}
      - name: cargo test
        working-directory: services/prover
        run: cargo test --lib
      - name: cargo build (release)
        working-directory: services/prover
        run: cargo build --release

  # ----------------------------------------------------------
  # Merkle service — tests
  #
  # Requires the compiled ACIRs (hash2.json, hashes.json, withdrawal.json)
  # under services/merkle/circuits/. These are gitignored build artifacts,
  # so we install nargo and compile the circuits here.
  # ----------------------------------------------------------
  merkle:
    name: Merkle service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.5.1"

      - name: Install dependencies
        working-directory: services/merkle
        run: pnpm install --frozen-lockfile

      - name: Install nargo
        run: |
          curl -L https://raw.githubusercontent.com/noir-lang/noirup/refs/heads/main/install | bash
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
          "$HOME/.nargo/bin/noirup" --version v1.0.0-rc.2

      - name: Compile circuits
        run: |
          set -e
          for c in poseidon hash2 hashes withdrawal; do
            (cd "circuits/$c" && nargo compile)
          done

      - name: Sync circuits into services/merkle/circuits
        run: |
          set -e
          mkdir -p services/merkle/circuits
          cp circuits/hash2/target/hash2.json           services/merkle/circuits/
          cp circuits/hashes/target/hashes.json         services/merkle/circuits/
          cp circuits/withdrawal/target/withdrawal.json services/merkle/circuits/

      - name: Run tests
        working-directory: services/merkle
        run: pnpm test

  # ----------------------------------------------------------
  # Frontend — typecheck + build
  # ----------------------------------------------------------
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.5.1"
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: pnpm typecheck
      - name: Build
        working-directory: web
        run: pnpm build
