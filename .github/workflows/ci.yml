name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ----------------------------------------------------------
  # Spec validation — `spec.json` matches all consumers
  # ----------------------------------------------------------
  validate-spec:
    name: Validate spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run validate-spec
        run: cargo run --manifest-path scripts/validate-spec/Cargo.toml --release

  # ----------------------------------------------------------
  # On-chain program — build + unit tests
  # ----------------------------------------------------------
  onchain:
    name: On-chain program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            onchain/target
          key: ${{ runner.os }}-onchain-${{ hashFiles('onchain/Cargo.lock') }}
      - name: cargo check
        working-directory: onchain
        run: cargo check --workspace
      - name: cargo test (lib)
        working-directory: onchain
        run: cargo test -p zk_pool --lib

  # ----------------------------------------------------------
  # LiteSVM integration tests
  # ----------------------------------------------------------
  litesvm:
    name: LiteSVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tests/target
          key: ${{ runner.os }}-tests-${{ hashFiles('tests/Cargo.lock') }}
      - name: cargo test
        working-directory: tests
        run: cargo test

  # ----------------------------------------------------------
  # Backend — build + unit tests
  # ----------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/backend/target
          key: ${{ runner.os }}-backend-${{ hashFiles('services/backend/Cargo.lock') }}
      - name: cargo test
        working-directory: services/backend
        run: cargo test --lib
      - name: cargo build (release)
        working-directory: services/backend
        run: cargo build --release

  # ----------------------------------------------------------
  # Prover — build + unit tests
  # ----------------------------------------------------------
  prover:
    name: Prover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/prover/target
          key: ${{ runner.os }}-prover-${{ hashFiles('services/prover/Cargo.lock') }}
      - name: cargo test
        working-directory: services/prover
        run: cargo test --lib
      - name: cargo build (release)
        working-directory: services/prover
        run: cargo build --release

  # ----------------------------------------------------------
  # Merkle service — tests
  # ----------------------------------------------------------
  merkle:
    name: Merkle service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.5.1"

      - name: Install dependencies
        working-directory: services/merkle
        run: pnpm install --frozen-lockfile

      # The Merkle service tests require the compiled ACIRs
      # (hash2.json, hashes.json, withdrawal.json) under
      # services/merkle/circuits/. These are gitignored build artifacts,
      # so CI must build them from the Noir sources before running tests.
      #
      # We install nargo via noirup (the same installer used in the local
      # Docker environment) and compile the three circuits.
      - name: Install nargo
        run: |
          curl -L https://raw.githubusercontent.com/noir-lang/noirup/refs/heads/main/install | bash
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
          "$HOME/.nargo/bin/noirup" --version v1.0.0-rc.2

      - name: Compile circuits
        run: |
          set -e
          for c in poseidon hash2 hashes withdrawal; do
            (cd "circuits/$c" && nargo compile)
          done

      - name: Sync circuits into services/merkle/circuits
        run: |
          set -e
          mkdir -p services/merkle/circuits
          cp circuits/hash2/target/hash2.json           services/merkle/circuits/
          cp circuits/hashes/target/hashes.json         services/merkle/circuits/
          cp circuits/withdrawal/target/withdrawal.json services/merkle/circuits/

      - name: Run tests
        working-directory: services/merkle
        run: pnpm test

  # ----------------------------------------------------------
  # Frontend — typecheck + build
  # ----------------------------------------------------------
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.5.1"
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: pnpm typecheck
      - name: Build
        working-directory: web
        run: pnpm build
