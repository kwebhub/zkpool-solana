name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  # ----------------------------------------------------------
  # cargo-audit — advisory database check across every crate
  # ----------------------------------------------------------
  cargo-audit:
    name: cargo audit (Rust) (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - onchain
          - tests
          - services/backend
          - services/prover
          - scripts/pool-init
          - scripts/e2e-deposit
          - scripts/e2e-withdraw
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - name: Run cargo audit
        working-directory: ${{ matrix.crate }}
        # Report-only: findings are surfaced in the log but do not fail the
        # job. This stays `|| true` until Stage 13's triage is complete for
        # every crate. See PROJECT_CONTEXT.md §6 (Stage 12 known gaps).
        run: cargo audit --deny warnings || true

  # ----------------------------------------------------------
  # pnpm-audit — advisory database check for Node packages
  # ----------------------------------------------------------
  pnpm-audit:
    name: pnpm audit (Node) (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - services/merkle
          - web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          version: "12.5.1"
      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        working-directory: ${{ matrix.dir }}
        # Report-only, matching cargo-audit above.
        run: pnpm audit --audit-level=high || true

  # ----------------------------------------------------------
  # cargo-deny — licenses, bans, sources
  #
  # `cargo deny` requires a Cargo.toml in the current directory to
  # resolve the dependency graph. The repo root has none — it is a
  # workspace of independent crates. We run it from `services/backend`
  # (largest dependency tree) and point it at the root `deny.toml`.
  # ----------------------------------------------------------
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - name: Run cargo deny
        working-directory: services/backend
        run: |
          if [ -f ../../deny.toml ]; then
            cargo deny --config ../../deny.toml check
          else
            echo "deny.toml not found — skipping"
          fi
