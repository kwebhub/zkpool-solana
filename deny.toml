# cargo-deny configuration.
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

# Advisory database
[advisories]
version = 2
ignore = [
  # Add specific RUSTSEC IDs to ignore here, with a comment explaining why.
  # Example:
  # "RUSTSEC-2023-0001", # description
]
severity-threshold = "medium"

# License compliance
[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "MPL-2.0",
  "OpenSSL",
]
confidence-threshold = 0.9

# Bans — specific crates or duplicates
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
  # Example: pin-down a specific version if a CVE is outstanding
]

# Source allowlist
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
