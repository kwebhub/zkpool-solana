# cargo-deny configuration — for cargo-deny 0.20.2.
#
# Key points:
#   - `version = 2` and `allow-osi-fsf-free` are removed in 0.20.x.
#   - All licenses are denied by default; only entries in `allow` pass.
#   - Workspace crates (private, unpublished) are skipped via `private`.
#   - Compound expressions must be listed verbatim.

[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

# ============================================================
# LICENSES
# ============================================================

[licenses]
confidence-threshold = 0.8
private = { ignore = true }

allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

# ============================================================
# ADVISORIES
# ============================================================

[advisories]
yanked = "warn"

# ============================================================
# BANS
# ============================================================

[bans]
multiple-versions = "warn"
wildcards = "deny"

# ============================================================
# SOURCES
# ============================================================

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
