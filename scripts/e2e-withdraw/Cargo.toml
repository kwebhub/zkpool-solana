[package]
name = "e2e-withdraw"
version = "0.1.0"
edition = "2021"
rust-version = "1.90.0"
license = "MIT"
description = "E2E withdraw script: parses a note, builds witness, sends withdraw tx."

[[bin]]
name = "e2e-withdraw"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
hex = "0.4"
base64 = "0.22"

solana-hash = "4.5.0"
solana-instruction = "3.4.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-pubkey = "3"
solana-sdk-ids = "3.1.0"
solana-signer = "3.0.1"

solana-address = { version = "~2.6.1", features = ["curve25519"] }

zk_pool = { path = "../../onchain/programs/zk_pool" }

[workspace]
