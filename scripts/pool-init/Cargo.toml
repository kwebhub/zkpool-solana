[package]
name = "pool-init"
version = "0.1.0"
edition = "2021"
rust-version = "1.90.0"
license = "MIT"
description = "Initialize the zkpool on-chain pool on Solana devnet."

[[bin]]
name = "pool-init"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
bs58 = "0.5"
hex = "0.4"

solana-hash = "4.5.0"
solana-instruction = "3.4.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-pubkey = "3"
solana-sdk-ids = "3.1.0"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"

[workspace]
